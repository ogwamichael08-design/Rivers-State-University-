<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rivers State University | RSU Port Harcourt</title>
  <meta name="description" content="Explore Rivers State University, Port Harcourt — academic programmes, admissions, research, student life, university news and events." />
  <meta name="theme-color" content="#063b2b" />

  <!-- Open Graph -->
  <meta property="og:title" content="Rivers State University | RSU Port Harcourt" />
  <meta property="og:description" content="University information portal for Rivers State University." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1600&q=80" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --primary: #063b2b;
      --primary-dark: #03271d;
      --secondary: #0b6045;
      --gold: #d9aa3d;
      --gold-light: #f4df9a;
      --cream: #faf8f1;
      --white: #ffffff;
      --dark: #17201c;
      --muted: #68736e;
      --border: #e4e8e5;
      --shadow: 0 18px 50px rgba(0,0,0,.08);
      --radius: 18px;
      --max: 1200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--dark);
      background: var(--white);
      line-height: 1.7;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(92%, var(--max));
      margin: auto;
    }

    .section {
      padding: 90px 0;
    }

    .section-header {
      max-width: 720px;
      margin: 0 auto 50px;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: .78rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .section-title {
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .section-description {
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 21px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 700;
      transition: .25s ease;
    }

    .btn-primary {
      background: var(--gold);
      color: #17120a;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #edc75d;
    }

    .btn-outline {
      border-color: rgba(255,255,255,.5);
      color: white;
      background: transparent;
    }

    .btn-outline:hover {
      background: white;
      color: var(--primary);
    }

    .btn-dark {
      background: var(--primary);
      color: white;
    }

    /* Announcement */
    .announcement {
      background: var(--primary-dark);
      color: white;
      padding: 8px 0;
      font-size: .85rem;
    }

    .announcement-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .announcement i {
      color: var(--gold);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 210px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-weight: 800;
      border: 3px solid var(--gold);
    }

    .brand strong {
      display: block;
      font-family: "Playfair Display", serif;
      line-height: 1.1;
    }

    .brand small {
      color: var(--muted);
      font-size: .7rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      list-style: none;
      font-size: .88rem;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--secondary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-btn,
    .menu-btn {
      border: 0;
      background: transparent;
      font-size: 1.1rem;
    }

    .menu-btn {
      display: none;
    }

    /* Hero */
    .hero {
      min-height: 690px;
      display: grid;
      place-items: center;
      color: white;
      position: relative;
      background:
        linear-gradient(90deg, rgba(2,30,22,.92), rgba(3,39,29,.66), rgba(3,39,29,.35)),
        url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=2000&q=85")
        center/cover;
    }

    .hero-content {
      max-width: 850px;
      padding: 90px 0;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(3rem, 7vw, 5.8rem);
      line-height: .98;
      margin-bottom: 22px;
    }

    .hero p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      max-width: 700px;
      color: #f0f5f2;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: rgba(255,255,255,.2);
      margin-top: 65px;
      border-radius: 15px;
      overflow: hidden;
    }

    .hero-info div {
      background: rgba(0,0,0,.25);
      padding: 18px;
      backdrop-filter: blur(8px);
    }

    .hero-info strong {
      display: block;
      color: var(--gold-light);
      margin-bottom: 3px;
    }

    .hero-info span {
      font-size: .82rem;
      color: #eee;
    }

    /* Quick Access */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .quick-card {
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      transition: .25s;
    }

    .quick-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
      border-color: var(--gold);
    }

    .icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #edf5f1;
      color: var(--secondary);
      margin-bottom: 15px;
    }

    .quick-card h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .quick-card p {
      color: var(--muted);
      font-size: .82rem;
    }

    /* About */
    .about {
      background: var(--cream);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .about-image {
      border-radius: 25px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .about-image img {
      height: 500px;
      width: 100%;
      object-fit: cover;
    }

    .vision-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 25px 0;
    }

    .vision-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    .vision-box h3 {
      font-family: "Playfair Display", serif;
      margin-bottom: 5px;
    }

    .vision-box p {
      color: var(--muted);
      font-size: .87rem;
    }

    /* Features */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .feature-card {
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: var(--radius);
      transition: .25s;
    }

    .feature-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-4px);
    }

    .feature-card h3 {
      margin-bottom: 7px;
    }

    .feature-card p {
      color: var(--muted);
      font-size: .9rem;
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .filters input,
    .filters select,
    .form-control {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: white;
    }

    .filters > * {
      flex: 1;
      min-width: 190px;
    }

    .filters input:focus,
    .filters select:focus,
    .form-control:focus {
      border-color: var(--secondary);
    }

    /* Programmes */
    .programme-grid,
    .faculty-grid,
    .news-grid,
    .event-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .programme-card,
    .faculty-card,
    .news-card,
    .event-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: white;
    }

    .programme-card {
      padding: 25px;
    }

    .programme-card .tag,
    .news-card .tag {
      display: inline-block;
      background: #edf5f1;
      color: var(--secondary);
      border-radius: 30px;
      padding: 5px 10px;
      font-size: .72rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .programme-card h3,
    .faculty-card h3 {
      margin-bottom: 8px;
    }

    .programme-card p,
    .faculty-card p,
    .news-card p {
      color: var(--muted);
      font-size: .86rem;
    }

    /* Admissions */
    .admissions {
      background: var(--primary);
      color: white;
    }

    .admission-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .admission-card {
      padding: 25px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      border-radius: 15px;
    }

    .admission-card i {
      color: var(--gold);
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .admission-card p {
      color: #d7e1dc;
      font-size: .85rem;
      margin-top: 6px;
    }

    /* Student Life */
    .life-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .life-card {
      min-height: 210px;
      border-radius: 16px;
      padding: 25px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .life-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent, rgba(0,0,0,.8));
    }

    .life-card > * {
      position: relative;
    }

    /* Research */
    .research {
      background: var(--cream);
    }

    .research-box {
      background: var(--primary);
      color: white;
      padding: 55px;
      border-radius: 25px;
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      align-items: center;
      gap: 30px;
    }

    .research-box p {
      color: #d8e3de;
      margin: 15px 0 25px;
    }

    /* News */
    .news-card img {
      height: 200px;
      width: 100%;
      object-fit: cover;
    }

    .news-body {
      padding: 20px;
    }

    .news-meta {
      color: var(--muted);
      font-size: .76rem;
      margin-bottom: 8px;
    }

    /* Events */
    .event-card {
      padding: 25px;
    }

    .event-date {
      color: var(--gold);
      font-weight: 800;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    /* Stats */
    .stats {
      background: var(--primary-dark);
      color: white;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      gap: 20px;
    }

    .stat strong {
      display: block;
      color: var(--gold);
      font-family: "Playfair Display", serif;
      font-size: 3rem;
    }

    .stat span {
      color: #d2ddd7;
    }

    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 190px;
      gap: 12px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 14px;
      cursor: pointer;
    }

    .gallery-item:first-child {
      grid-row: span 2;
      grid-column: span 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* Testimonials */
    .testimonial {
      background: var(--cream);
      padding: 70px 0;
    }

    .testimonial-card {
      max-width: 800px;
      margin: auto;
      text-align: center;
      background: white;
      border-radius: 20px;
      padding: 45px;
      box-shadow: var(--shadow);
    }

    .testimonial-card blockquote {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }

    .placeholder {
      color: #a66a00;
      font-size: .8rem;
      background: #fff7df;
      padding: 3px 7px;
      border-radius: 5px;
    }

    /* FAQ */
    .faq {
      max-width: 850px;
      margin: auto;
    }

    .faq-item {
      border-bottom: 1px solid var(--border);
    }

    .faq-question {
      width: 100%;
      background: transparent;
      border: 0;
      text-align: left;
      padding: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .faq-answer {
      display: none;
      color: var(--muted);
      padding: 0 0 20px;
    }

    .faq-item.active .faq-answer {
      display: block;
    }

    /* Contact */
    .contact {
      background: var(--cream);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 40px;
    }

    .contact-info {
      display: grid;
      gap: 15px;
    }

    .contact-box {
      background: white;
      padding: 20px;
      border-radius: 13px;
      border: 1px solid var(--border);
    }

    .contact-box i {
      color: var(--secondary);
      margin-right: 8px;
    }

    .contact-form {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    textarea.form-control {
      min-height: 140px;
      resize: vertical;
    }

    /* Footer */
    footer {
      background: #021d15;
      color: white;
      padding: 70px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, 1fr);
      gap: 40px;
      padding-bottom: 50px;
    }

    footer h3 {
      margin-bottom: 15px;
    }

    footer p,
    footer a {
      color: #b9c9c2;
      font-size: .88rem;
    }

    footer a {
      display: block;
      margin: 7px 0;
    }

    footer a:hover {
      color: var(--gold);
    }

    .socials {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .socials a {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #375048;
      border-radius: 50%;
    }

    .footer-bottom {
      border-top: 1px solid #29443b;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,.9);
      display: none;
      place-items: center;
      padding: 30px;
    }

    .lightbox.active {
      display: grid;
    }

    .lightbox img {
      max-height: 90vh;
      max-width: 95vw;
      border-radius: 10px;
    }

    .close-lightbox {
      position: absolute;
      top: 25px;
      right: 30px;
      color: white;
      font-size: 2rem;
      background: transparent;
      border: 0;
    }

    /* Back to top */
    .back-top {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 0;
      background: var(--gold);
      display: none;
      z-index: 900;
    }

    .back-top.show {
      display: block;
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: var(--muted);
    }

    /* Responsive */
    @media (max-width: 1050px) {
      .nav-links {
        gap: 12px;
      }

      .quick-grid,
      .life-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .admission-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 900px) {
      .menu-btn {
        display: block;
      }

      .nav-links {
        position: absolute;
        top: 78px;
        left: 0;
        right: 0;
        background: white;
        padding: 20px;
        display: none;
        flex-direction: column;
        align-items: stretch;
        border-bottom: 1px solid var(--border);
      }

      .nav-links.active {
        display: flex;
      }

      .nav-actions .btn {
        display: none;
      }

      .about-grid,
      .contact-grid,
      .research-box {
        grid-template-columns: 1fr;
      }

      .programme-grid,
      .faculty-grid,
      .news-grid,
      .event-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .feature-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero-info {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .section {
        padding: 65px 0;
      }

      .brand small {
        display: none;
      }

      .hero {
        min-height: 720px;
      }

      .hero-info,
      .quick-grid,
      .feature-grid,
      .programme-grid,
      .faculty-grid,
      .news-grid,
      .event-grid,
      .admission-grid,
      .life-grid,
      .stats-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .vision-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 150px;
      }

      .gallery-item:first-child {
        grid-row: span 1;
        grid-column: span 2;
      }

      .research-box {
        padding: 30px;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- ANNOUNCEMENT -->
  <div class="announcement">
    <div class="container announcement-inner">
      <i class="fa-solid fa-bullhorn"></i>
      <span id="announcementText">Admissions • Academic Programmes • University News • Events</span>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="container nav">
      <a href="#home" class="brand">
        <div class="logo">RSU</div>
        <div>
          <strong>Rivers State University</strong>
          <small>Port Harcourt, Rivers State, Nigeria</small>
        </div>
